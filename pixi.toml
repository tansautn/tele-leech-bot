[workspace]
authors = ["Zuko <tansautn@gmail.com>"]
channels = ["conda-forge"]
name = "tele-leech-bot"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
bot = "python -m bot"

[dependencies]
python = ">=3.11,<3.12"

[feature.cli.pypi-dependencies]
oauth2client = "*"
google-api-python-client = "*"
progress = "*"
progressbar2 = "*"
httplib2shim = "*"
google-auth-oauthlib = "*"
kurigram = "*"
cli = "*"

[pypi-dependencies]
asyncio = ">=4.0.0, <5"
aiofiles = ">=25.1.0, <26"
aioshutil = ">=1.6, <2"
anytree = ">=2.13.0, <3"
apscheduler = ">=3.11.3, <4"
aioaria2 = ">=1.3.7, <2"
aioqbt = ">=1.1.0, <2"
cloudscraper = ">=1.2.71, <2"
dnspython = ">=2.9.1, <3"
fastapi = ">=0.162.0, <0.163"
feedparser = ">=6.0.14, <7"
google-api-python-client = ">=2.201.0, <3"
google-auth-httplib2 = ">=0.4.4, <0.5"
google-auth-oauthlib = ">=1.5.0, <2"
gunicorn = ">=26.2.0, <27"
httpx = ">=0.28.1, <0.29"
jinja2 = ">=3.1.6, <4"
lxml = ">=6.1.3, <7"
natsort = ">=8.4.0, <9"
par2cmdline-turbo = ">=1.4.0, <2"
pillow = ">=13.0.0, <14"
psutil = ">=7.2.2, <8"
pymongo = ">=4.19.0, <5"
kurigram = ">=2.2.26, <3"
python-magic = ">=0.4.27, <0.5"
requests = ">=2.34.2, <3"
telegraph = ">=2.2.0, <3"
tenacity = ">=9.2.1, <10"
tgcrypto = ">=1.2.5, <2"
urllib3 = ">=2.8.0, <3"
uvicorn = ">=0.54.0, <0.55"
yt-dlp = { version = ">=2026.10.26, <2027", extras = ["default", "curl-cffi"] }

[target.linux-64.pypi-dependencies]
uvloop = ">=0.23.0, <0.24"
xattr = ">=1.3.0, <2"

[environments]
cli = {features=["cli"]}
