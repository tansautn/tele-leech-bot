[program:telebot]
process_name=%(program_name)s_%(process_num)02d
command=pixi run bot
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
stopwaitsecs=60
stopsignal=sigint
directory=/usr/local/share/tele-leech-bot
environment=PATH="$HOME/.pixi/bin"
user=web
redirect_stderr=true
stdout_logfile=/home/web/logs/telebot_stdout.log
stderr_logfile=/home/web/logs/telebot_stderr.log
